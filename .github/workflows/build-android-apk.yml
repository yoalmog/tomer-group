name: Build Android APK (Tomer Group Mobile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore Dependencies
        run: dotnet restore TomerGroup.sln

      - name: Build & Publish Android APK
        run: >
          dotnet publish src/TomerGroup.Mobile/TomerGroup.Mobile.csproj
          -f net8.0-android
          -c Release
          /p:EnableMaui=true
          /p:AndroidPackageFormats=apk
          -o ./artifacts/apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomerGroup-Android-APK
          path: ./artifacts/apk/*.apk

